<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
<title id="title">Smart building energy digital twin architecture</title><desc id="desc">Conceptual architecture showing building data inputs, data quality checks, hybrid physical and machine learning models, optimization, and evidence outputs.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071a29"/><stop offset="1" stop-color="#18354b"/></linearGradient><linearGradient id="teal" x1="0" x2="1"><stop stop-color="#2ad4c9"/><stop offset="1" stop-color="#5f9cff"/></linearGradient><linearGradient id="gold" x1="0" x2="1"><stop stop-color="#ffd56d"/><stop offset="1" stop-color="#f58d62"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".32"/></filter><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#a5cfe2"/></marker><style>.h{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;fill:#f7fbff}.s{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#bdd8e8}.tag{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;fill:#6fe8dd}.t{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#f7fbff}.b{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#c9dfe9}.tiny{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#9abccc}.n{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#081b2b}</style></defs>
<rect width="1440" height="780" fill="url(#bg)"/><circle cx="1280" cy="60" r="190" fill="#24536d" opacity=".28"/><circle cx="120" cy="750" r="220" fill="#0e6a72" opacity=".19"/>
<text x="70" y="76" class="h">Smart building energy digital twin: hybrid research architecture</text><text x="70" y="108" class="s">Conceptual system diagram — data-driven results are produced only after local ASHRAE data inspection and executed experiments.</text><line x1="70" y1="140" x2="1370" y2="140" stroke="#2b5c76"/>
<g filter="url(#shadow)"><rect x="70" y="190" width="250" height="212" rx="18" fill="#123249" stroke="#35637d"/><rect x="94" y="214" width="42" height="26" rx="13" fill="url(#teal)"/><text x="109" y="233" class="n">01</text><text x="94" y="273" class="t">Observed building data</text><text x="94" y="306" class="b">Meter readings</text><text x="94" y="332" class="b">Weather time series</text><text x="94" y="358" class="b">Building metadata</text><text x="94" y="385" class="tiny">Local, untracked ASHRAE tables</text></g>
<g filter="url(#shadow)"><rect x="390" y="190" width="250" height="212" rx="18" fill="#123249" stroke="#35637d"/><rect x="414" y="214" width="42" height="26" rx="13" fill="url(#teal)"/><text x="429" y="233" class="n">02</text><text x="414" y="273" class="t">Data quality layer</text><text x="414" y="306" class="b">Schema validation</text><text x="414" y="332" class="b">Temporal alignment</text><text x="414" y="358" class="b">Missingness &amp; anomalies</text><text x="414" y="385" class="tiny">Chronological leakage checks</text></g>
<g filter="url(#shadow)"><rect x="710" y="190" width="250" height="212" rx="18" fill="#123249" stroke="#35637d"/><rect x="734" y="214" width="42" height="26" rx="13" fill="url(#teal)"/><text x="749" y="233" class="n">03</text><text x="734" y="273" class="t">Hybrid twin state</text><text x="734" y="306" class="b">Two-state RC thermal model</text><text x="734" y="332" class="b">Energy forecast model</text><text x="734" y="358" class="b">Latent efficiency state</text><text x="734" y="385" class="tiny">Physics + machine learning</text></g>
<g filter="url(#shadow)"><rect x="1030" y="190" width="340" height="212" rx="18" fill="#123249" stroke="#35637d"/><rect x="1054" y="214" width="42" height="26" rx="13" fill="url(#teal)"/><text x="1069" y="233" class="n">04</text><text x="1054" y="273" class="t">Decision &amp; trust layer</text><text x="1054" y="306" class="b">Comfort–cost optimization</text><text x="1054" y="332" class="b">Degradation sensitivity study</text><text x="1054" y="358" class="b">Sensor/energy anomaly detection</text><text x="1054" y="385" class="tiny">Transparent scenario assumptions</text></g>
<path d="M320 296 H382" stroke="#a5cfe2" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 296 H702" stroke="#a5cfe2" stroke-width="3" marker-end="url(#arrow)"/><path d="M960 296 H1022" stroke="#a5cfe2" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="120" y="510" width="350" height="184" rx="18" fill="#123d4a" stroke="#358f96"/><text x="146" y="546" class="tag">FORECASTING EVIDENCE</text><text x="146" y="583" class="t">Energy demand model</text><text x="146" y="615" class="b">Chronological train / validation / test</text><text x="146" y="641" class="b">MAE, RMSE, sMAPE and residual analysis</text><text x="146" y="668" class="tiny">Baseline and optional neural forecaster</text></g>
<g filter="url(#shadow)"><rect x="545" y="510" width="350" height="184" rx="18" fill="#393044" stroke="#8c70a5"/><text x="571" y="546" class="tag" fill="#ffdca0">SYSTEM-MODEL EVIDENCE</text><text x="571" y="583" class="t">Thermal and degradation scenarios</text><text x="571" y="615" class="b">RC parameter calibration and uncertainty</text><text x="571" y="641" class="b">Efficiency decay / sensor bias injection</text><text x="571" y="668" class="tiny">Explicitly simulated, not claimed observed failures</text></g>
<g filter="url(#shadow)"><rect x="970" y="510" width="350" height="184" rx="18" fill="#443824" stroke="#b98d4f"/><text x="996" y="546" class="tag" fill="#ffe4a6">REPRODUCIBLE OUTPUTS</text><text x="996" y="583" class="t">Figures, tables &amp; MATLAB analysis</text><text x="996" y="615" class="b">Forecast, comfort, cost, and anomaly plots</text><text x="996" y="641" class="b">CSV results, model cards, report inputs</text><text x="996" y="668" class="tiny">Generated locally only after execution</text></g>
<path d="M1200 402 C1200 456 1145 465 1145 500" fill="none" stroke="#ffd56d" stroke-width="3" marker-end="url(#arrow)"/><path d="M1200 402 C1200 456 720 465 720 500" fill="none" stroke="#ffd56d" stroke-width="3" marker-end="url(#arrow)"/><path d="M1200 402 C1200 456 295 465 295 500" fill="none" stroke="#ffd56d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="70" y="742" class="tiny">The architecture supports forecast, optimization, and maintenance research. It does not claim a deployed building-management system or ground-truth fault labels.</text>
</svg>
