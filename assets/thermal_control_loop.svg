<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
<title id="title">Physics-informed thermal control loop</title><desc id="desc">Conceptual two-state RC model and rolling optimization loop for indoor comfort and energy cost.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#fffaf2"/><stop offset="1" stop-color="#f1f8ff"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#31516a" flood-opacity=".16"/></filter><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#5b788e"/></marker><style>.h{font-family:Arial,Helvetica,sans-serif;font-size:31px;font-weight:700;fill:#19344d}.s{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#5c768b}.t{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#19344d}.b{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#49657a}.m{font-family:Georgia,serif;font-size:16px;fill:#284760}.tag{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;fill:#2a7b92}.white{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#fff}</style></defs>
<rect width="1440" height="680" fill="url(#bg)"/><text x="70" y="72" class="h">Physics-informed thermal twin and optimization loop</text><text x="70" y="104" class="s">A two-state RC simulator supports counterfactual control scenarios; its parameters and outputs are calibrated/evaluated only after real data are available.</text><line x1="70" y1="133" x2="1370" y2="133" stroke="#d8e5ed"/>
<g filter="url(#shadow)"><rect x="85" y="205" width="270" height="260" rx="20" fill="#fff" stroke="#c5d8e3"/><text x="112" y="241" class="tag">EXOGENOUS SIGNALS</text><text x="112" y="279" class="t">Observed / scenario inputs</text><text x="112" y="317" class="b">Outdoor temperature</text><text x="112" y="343" class="b">Solar and internal gains</text><text x="112" y="369" class="b">Occupancy schedule proxy</text><text x="112" y="395" class="b">Electricity price</text><text x="112" y="435" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#748a9b">Validated weather/meter join after inspection</text></g>
<g filter="url(#shadow)"><rect x="480" y="185" width="420" height="300" rx="20" fill="#153b52"/><text x="512" y="225" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;fill:#71dfd8">STATE SPACE / RC THERMAL MODEL</text><text x="512" y="266" class="white">Indoor air state Tₐ and thermal mass state Tₘ</text><circle cx="600" cy="355" r="50" fill="#3b86b6"/><text x="572" y="361" class="white">Tₐ</text><circle cx="784" cy="355" r="50" fill="#5cb7aa"/><text x="756" y="361" class="white">Tₘ</text><line x1="650" y1="355" x2="734" y2="355" stroke="#c7eef0" stroke-width="4"/><text x="675" y="337" style="font-family:Georgia,serif;font-size:18px;fill:#d8f2f4">Rₐₘ</text><text x="512" y="445" style="font-family:Georgia,serif;font-size:16px;fill:#dbecf4">Cₐ dTₐ/dt = heat flows + η·P_HVAC</text></g>
<g filter="url(#shadow)"><rect x="1020" y="205" width="320" height="260" rx="20" fill="#fff" stroke="#c5d8e3"/><text x="1047" y="241" class="tag">ROLLING DECISION LAYER</text><text x="1047" y="279" class="t">Constrained action search</text><text x="1047" y="317" class="b">Setpoint shift / schedule choice</text><text x="1047" y="343" class="b">Comfort penalty</text><text x="1047" y="369" class="b">Energy cost and peak penalty</text><text x="1047" y="395" class="b">Action feasibility constraints</text><text x="1047" y="435" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#748a9b">Recommends scenarios; does not actuate equipment</text></g>
<path d="M355 335 H468" stroke="#5b788e" stroke-width="3" marker-end="url(#arrow)"/><path d="M900 335 H1008" stroke="#5b788e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1180 467 C1180 545 685 548 685 495" fill="none" stroke="#e19a52" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="280" y="535" width="880" height="83" rx="18" fill="#fff0db" stroke="#e6bc80"/><text x="314" y="569" class="t">Research outputs from the loop</text><text x="314" y="597" class="b">Predicted load • indoor-temperature trajectory • comfort violation hours • electricity cost • peak demand • degradation sensitivity</text></g>
</svg>
